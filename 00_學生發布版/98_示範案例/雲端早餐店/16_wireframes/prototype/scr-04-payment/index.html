<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-04 結帳｜線框原型</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/wire.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="screen.css">
</head>
<body data-state="default" data-mode="color">

<div class="devbar" role="group" aria-label="狀態切換">
  <strong>SCR-04</strong><span>結帳</span>
  <span class="spacer"></span>
  <button data-set-state="default">default</button>
  <button data-set-state="loading">loading</button>
  <button data-set-state="empty">empty</button>
  <button data-set-state="error">error</button>
  <button data-set-state="success">success</button>
  <button data-set-state="interrupted">interrupted</button>
  <button data-toggle-mode>線框模式</button>
</div>

<main class="app " aria-live="polite">
  <header class="topbar" data-wire-outline>
    <a class="back" href="#" aria-label="返回">←</a>
    <h1>結帳</h1>
    <span class="order-no">SCR-04</span>
  </header>
  <section class="state state-default">
    <div class="row total"><span>應付金額</span><b>NT$100</b></div>
    <fieldset class="pay">
      <legend class="field-label">付款方式</legend>
      <label class="pay-opt"><input type="radio" name="pay" checked> 行動支付（推薦）</label>
      <label class="pay-opt"><input type="radio" name="pay"> 信用卡</label>
      <label class="pay-opt"><input type="radio" name="pay"> 現場付現</label>
    </fieldset>
    <a class="btn-primary btn-block" href="#" data-action="pay">前往付款</a>
  </section>

  <section class="state state-loading">
    <div class="skel skel-block"></div>
    <p class="hint">正在處理付款，請不要關閉畫面</p>
  </section>

  <section class="state state-empty">
    <h2 class="status">沒有待付款的訂單</h2>
    <p class="hint">回到菜單重新點餐。</p>
    <a class="btn-primary" href="#">回菜單</a>
  </section>

  <section class="state state-error">
    <div class="banner banner-error" role="alert">
      <strong>付款沒有完成</strong><span>可以換一種付款方式再試一次。</span>
    </div>
    <a class="btn-primary btn-block" href="#" data-action="pay">重試</a>
    <a class="btn-secondary btn-block" href="#">換付款方式</a>
  </section>

  <section class="state state-success">
    <h2 class="status status-success">付款完成</h2>
    <p class="hint">我們開始準備你的早餐，取餐時間 08:25。</p>
    <a class="btn-primary" href="#" data-action="goto-status">查看訂單狀態</a>
  </section>

  <section class="state state-interrupted">
    <div class="banner banner-info">
      <strong>銀行還在確認</strong><span>稍後回來看結果就好，不會重複扣款。</span>
    </div>
    <a class="btn-secondary" href="#">稍後再看</a>
  </section>

  <footer class="foot" data-wire-outline><span class="msg-id">SCR-04</span></footer>
</main>

<script src="../assets/theme.js"></script>
<script src="../assets/state-switcher.js"></script>
<script src="../assets/story-data.js"></script>
<script src="../assets/story-runner.js"></script>
</body>
</html>
