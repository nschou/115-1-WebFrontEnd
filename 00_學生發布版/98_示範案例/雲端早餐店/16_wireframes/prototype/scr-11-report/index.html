<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-11 銷售報表｜線框原型</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/wire.css">
<link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="screen.css"></head>
<body data-state="default" data-mode="color">
<div class="devbar" role="group" aria-label="狀態切換">
  <strong>SCR-11</strong><span>銷售報表</span><span class="spacer"></span><button data-set-state="default">default</button><button data-set-state="loading">loading</button><button data-set-state="empty">empty</button><button data-set-state="error">error</button><button data-toggle-mode>線框模式</button>
</div>
<main class="app app--tablet" aria-live="polite">
  <section class="state state-default">
    <div class="kpis">
      <div class="kpi"><span>今日營收</span><b>NT$12,480</b></div>
      <div class="kpi"><span>客單價</span><b>NT$118</b></div>
      <div class="kpi"><span>訂單數</span><b>106</b></div>
    </div>
    <h3 class="sub">熱銷品（今日）</h3>
    <ol class="top"><li>全麥三明治 <span class="muted">38 份</span></li><li>拿鐵 <span class="muted">31 份</span></li><li>蛋餅 <span class="muted">27 份</span></li></ol>
    <p class="hint">資料來源：POS 記錄（決策 7）</p>
  </section>
  <section class="state state-loading">
    <p class="hint" data-loading>正在計算報表⋯</p>
    <div class="skel skel-title"></div><div class="skel skel-block"></div>
  </section>
  <section class="state state-empty">
    <h2 class="status">今天還沒有資料</h2><p class="hint">開始接單後，這裡會即時累計。</p>
  </section>
  <section class="state state-error">
    <div class="banner banner-error" role="alert"><strong>報表載入失敗</strong><span>POS 連線異常，請稍後再試。</span></div><button data-element="E-48" class="btn-secondary" data-action="report-retry">重試</button>
  </section>
  <footer class="foot" data-wire-outline><span class="msg-id">SCR-11</span></footer>
</main>
<script src="../assets/theme.js"></script>
<script src="../assets/state-switcher.js"></script>
<script src="../assets/story-data.js"></script>
<script src="../assets/story-runner.js"></script>
</body></html>
