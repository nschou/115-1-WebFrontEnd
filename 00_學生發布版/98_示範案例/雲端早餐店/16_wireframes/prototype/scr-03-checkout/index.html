<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-03 下單確認｜線框原型</title>
<link rel="stylesheet" href="../assets/tokens.css">
<link rel="stylesheet" href="../assets/wire.css">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="screen.css">
</head>
<body data-state="default" data-mode="color">

<div class="devbar" role="group" aria-label="狀態切換">
  <strong>SCR-03</strong><span>下單確認</span>
  <span class="spacer"></span>
  <button data-set-state="default">default</button>
  <button data-set-state="loading">loading</button>
  <button data-set-state="empty">empty</button>
  <button data-set-state="error">error</button>
  <button data-set-state="success">success</button>
  <button data-set-state="interrupted">interrupted</button>
  <button data-toggle-mode>線框模式</button>
</div>

<main class="app " aria-live="polite">
  <header class="topbar" data-wire-outline>
    <a class="back" href="#" aria-label="返回">←</a>
    <h1>確認訂單</h1>
    <span class="order-no">SCR-03</span>
  </header>
  <section class="state state-default">
    <label class="field">
      <span class="field-label">取餐時段</span>
      <select class="input"><option>08:15–08:30</option><option>08:30–08:45</option></select>
    </label>
    <ul class="items">
      <li><span>全麥三明治 ×1<em data-element="E-13" class="muted">去冰、蛋半熟</em></span><b>NT$45</b></li>
      <li><span>拿鐵 ×1</span><b>NT$55</b></li>
    </ul>
    <div class="row total"><span>合計</span><b>NT$100</b></div>
    <label class="field">
      <span class="field-label">顧客姓名</span>
      <input class="input" value="王小明">
    </label>
    <a class="btn-primary btn-block" href="#" data-action="submit-order">送出訂單</a>
  </section>

  <section class="state state-loading">
    <div class="skel skel-title"></div><div class="skel skel-block"></div>
    <p class="hint">正在送出你的訂單⋯</p>
  </section>

  <section class="state state-empty">
    <p class="empty-icon">🛒</p>
    <h2 class="status">購物車還是空的</h2>
    <p class="hint">先看看今天的套餐？</p>
    <a data-element="E-50" class="btn-primary" href="#" data-action="back-to-menu">回菜單</a>
  </section>

  <section class="state state-error">
    <label class="field field-error">
      <span class="field-label" data-field="pickup-slot">取餐時段</span>
      <select class="input"><option>請選擇</option></select>
      <span class="error-text" data-error-for="pickup-slot">請選取一個取餐時間，讓我們準時為你準備</span>
    </label>
    <a class="btn-primary btn-block" href="#" data-action="submit-order">送出訂單</a>
  </section>

  <section class="state state-success">
    <h2 class="status status-success">已送出</h2>
    <p class="hint">訂單 #1042 已成立，接下來請完成付款。</p>
    <a class="btn-primary" href="#">前往付款</a>
  </section>

  <section class="state state-interrupted">
    <div class="banner banner-warn" role="alert">
      <strong>這項剛剛賣完了</strong><span>換一個試試？已幫你保留其他品項。</span>
    </div>
    <a class="btn-secondary" href="#">換品項</a>
  </section>

  <footer class="foot" data-wire-outline><span class="msg-id">SCR-03</span></footer>
</main>

<script src="../assets/theme.js"></script>
<script src="../assets/state-switcher.js"></script>
<script src="../assets/story-data.js"></script>
<script src="../assets/story-runner.js"></script>
</body>
</html>
