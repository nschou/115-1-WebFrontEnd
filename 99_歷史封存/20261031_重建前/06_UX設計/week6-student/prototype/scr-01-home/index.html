<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-01 首頁｜線框原型</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/wire.css">
<link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="screen.css"></head>
<body data-state="default" data-mode="color">
<div class="devbar" role="group" aria-label="狀態切換">
  <strong>SCR-01</strong><span>首頁</span><span class="spacer"></span><button data-set-state="default">default</button><button data-set-state="loading">loading</button><button data-set-state="empty">empty</button><button data-set-state="error">error</button><button data-set-state="interrupted">interrupted</button><button data-toggle-mode>線框模式</button>
</div>
<main class="app " aria-live="polite">
  <section class="state state-default">
    <div class="hero">
      <span class="img-slot img-slot--16x9">今日套餐照 16:9</span>
      <h data-element="E-02"2>今日套餐</h2><p class="muted">全麥三明治 ＋ 拿鐵</p>
      <a data-element="E-03" class="btn-primary" href="#" data-action="goto-menu">立即點餐 NT$90</a>
    </div>
    <div class="grid4">
      <a class="tile" href="#">主餐</a><a class="tile" href="#">套餐</a>
      <a class="tile" href="#">飲品</a><a class="tile" href="#">加購</a>
    </div>
    <p class="hint">上次點過：火腿蛋吐司＋紅茶 ｜ <a href="#">再點一次</a></p>
  </section>
  <section class="state state-loading">
    <p class="hint" data-loading>正在取得今日推薦⋯</p>
    <div class="skel skel-title"></div><div class="skel skel-block"></div><div class="skel skel-line"></div>
  </section>
  <section class="state state-empty">
    <p class="empty-icon">🍳</p><h2 class="status">今天還沒有推薦</h2>
    <p class="hint">直接看菜單也可以。</p><a class="btn-primary" href="#" data-action="goto-menu">看菜單</a>
  </section>
  <section class="state state-error">
    <div class="banner banner-error" role="alert"><strong>菜單載入失敗</strong><span>檢查網路後再試一次。</span></div>
    <button data-element="E-49" class="btn-secondary" data-action="retry-menu">重新載入</button>
  </section>
  <section class="state state-interrupted">
    <h data-element="E-01"2 class="status">現在未營業</h2>
    <p class="hint">營業時間 06:00–14:00。可以先看看菜單，開店後再點。</p>
    <a class="btn-secondary" href="#">看菜單</a>
  </section>
  <footer class="foot" data-wire-outline><span class="msg-id">SCR-01</span></footer>
</main>
<script src="../assets/theme.js"></script>
<script src="../assets/state-switcher.js"></script>
<script src="../assets/story-data.js"></script>
<script src="../assets/story-runner.js"></script>
</body></html>
