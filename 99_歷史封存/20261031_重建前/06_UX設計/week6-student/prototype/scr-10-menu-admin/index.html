<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCR-10 菜單維護｜線框原型</title>
<link rel="stylesheet" href="../assets/tokens.css"><link rel="stylesheet" href="../assets/wire.css">
<link rel="stylesheet" href="../assets/base.css"><link rel="stylesheet" href="screen.css"></head>
<body data-state="default" data-mode="color">
<div class="devbar" role="group" aria-label="狀態切換">
  <strong>SCR-10</strong><span>菜單維護</span><span class="spacer"></span><button data-set-state="default">default</button><button data-set-state="loading">loading</button><button data-set-state="empty">empty</button><button data-set-state="error">error</button><button data-set-state="success">success</button><button data-set-state="interrupted">interrupted</button><button data-toggle-mode>線框模式</button>
</div>
<main class="app app--tablet" aria-live="polite">
  <section class="state state-default">
    <div class="chips"><button class="chip on">全部</button><button class="chip">上架</button><button class="chip">售完</button></div>
    <ul class="admin">
      <li><span class="img-slot img-slot--thumb">圖</span><div><b>全麥三明治</b><span class="muted">主餐 · NT$45</span></div>
        <label data-element="E-42" class="sw"><input type="checkbox" checked> 供應中</label></li>
      <li><span class="img-slot img-slot--thumb">圖</span><div><b>蛋餅</b><span class="muted">主餐 · NT$35</span></div>
        <label class="sw"><input type="checkbox" checked> 供應中</label></li>
      <li><span class="img-slot img-slot--thumb">圖</span><div><b>漢堡</b><span class="muted">主餐 · NT$50</span></div>
        <label class="sw"><input type="checkbox"> 供應中</label></li>
    </ul>
    <a class="btn-secondary" href="#" data-action="upload-photo">上傳／更換品項照</a>
    <a class="btn-primary" href="#" data-action="save-menu">儲存變更</a>
  </section>
  <section class="state state-loading">
    <p class="hint" data-loading>正在載入菜單資料⋯</p>
    <div class="skel skel-title"></div><div class="skel skel-block"></div>
  </section>
  <section class="state state-empty">
    <h2 class="status">還沒有任何品項</h2><p class="hint">先新增第一項餐點。</p><a class="btn-primary" href="#">新增品項</a>
  </section>
  <section class="state state-error">
    <div class="banner banner-error" role="alert"><strong>儲存失敗</strong><span>網路中斷，變更還沒送出，請重試。</span></div><button class="btn-secondary">重試</button>
  </section>
  <section class="state state-success">
    <h2 class="status status-success">已儲存</h2><p class="hint">顧客端菜單會在 1 分鐘內更新。</p><a class="btn-secondary" href="#">繼續編輯</a>
  </section>
  <section class="state state-interrupted">
    <div class="banner banner-warn" role="alert"><strong>這筆已被其他人修改</strong><span>你的變更沒有套用，請重新載入後再改。</span></div><button class="btn-secondary">重新載入</button>
  </section>
  <footer class="foot" data-wire-outline><span class="msg-id">SCR-10</span></footer>
</main>
<script src="../assets/theme.js"></script>
<script src="../assets/state-switcher.js"></script>
<script src="../assets/story-data.js"></script>
<script src="../assets/story-runner.js"></script>
</body></html>
